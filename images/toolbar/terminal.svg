<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Created for GitMaster -->
<svg
   width="32.0px"
   height="32.0px"
   viewBox="0 0 32.0 32.0"
   version="1.1"
   id="SVGRoot"
   xml:space="preserve"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <g id="layer1">
    <!-- Terminal window background/border -->
    <rect
       style="fill:#6383a4;fill-opacity:1;stroke:#31465d;stroke-width:1;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:4;stroke-dasharray:none;stroke-opacity:1"
       x="4"
       y="6"
       width="24"
       height="20"
       rx="3"
       ry="3" />
    <rect
       style="fill:#ffffff;fill-opacity:1;stroke:none"
       x="6"
       y="10"
       width="20"
       height="14"
       rx="1"
       ry="1" />
    <!-- Prompt symbol > -->
    <path
       d="M 9 13 L 13 17 L 9 21"
       style="fill:none;stroke:#31465d;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" />
    <!-- Cursor _ -->
    <line
       x1="15"
       y1="21"
       x2="20"
       y2="21"
       style="stroke:#31465d;stroke-width:2;stroke-linecap:round" />
  </g>
</svg>
